<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Network Request Monitor — small promo tile</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0c0d10;
        --surface: #18191c;
        --border: #2a2b30;
        --text: #f4f5f7;
        --text-2: #b7b8c2;
        --muted: #8d8e98;
        --accent: #5b8cff;
        --accent-2: #9bb6ff;
        --asset: #2dd4bf;
        --danger: #ff6b6b;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      .tile {
        width: 440px;
        height: 280px;
        padding: 14px 16px 12px;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(240px 140px at 100% 0%, rgba(91, 140, 255, 0.2), transparent 72%),
          var(--canvas);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 22px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .brand img {
        width: 18px;
        height: 18px;
        border-radius: 5px;
      }

      h1 {
        margin: 8px 0 10px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }

      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        min-height: 0;
      }

      .card {
        margin: 0;
        padding: 8px 10px 7px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-width: 0;
      }

      .token {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 16px;
        margin-bottom: 3px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 15px;
        padding: 0 5px;
        border-radius: 3px;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .get {
        background: #2563eb;
      }

      .post {
        background: #16a34a;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        height: 16px;
        padding: 0 6px;
        border: 1px solid;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .pill.api {
        color: var(--accent-2);
        border-color: var(--accent);
        background: rgba(91, 140, 255, 0.12);
      }

      .pill.asset {
        color: var(--asset);
        border-color: var(--asset);
        background: rgba(45, 212, 191, 0.12);
      }

      .pill.err {
        color: var(--danger);
        border-color: var(--danger);
        background: rgba(255, 107, 107, 0.12);
      }

      .search {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 16px;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .search svg {
        flex-shrink: 0;
      }

      .host {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 16px;
        margin-bottom: 3px;
        font-size: 10px;
        font-weight: 600;
      }

      .host img {
        width: 12px;
        height: 12px;
        border-radius: 2px;
      }

      .count {
        margin-left: auto;
        padding: 0 6px;
        border-radius: 999px;
        background: #1f2024;
        color: var(--text-2);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 500;
        line-height: 15px;
      }

      .card strong {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .card p {
        margin: 0;
        color: var(--text-2);
        font-size: 11px;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" />
        <span>Network Request Monitor</span>
      </div>
      <h1>Every request on this tab.</h1>
      <div class="grid">
        <div class="card">
          <div class="token">
            <span class="badge get">GET</span>
            <span class="badge post">POST</span>
          </div>
          <strong>Live list</strong>
          <p>Method and URL, newest first</p>
        </div>
        <div class="card">
          <div class="token">
            <span class="pill api">API</span>
            <span class="pill asset">Assets</span>
            <span class="pill err">Errors</span>
          </div>
          <strong>Quick filters</strong>
          <p>API requests, web assets, 4xx/5xx</p>
        </div>
        <div class="card">
          <div class="search">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>Filter by URL…</span>
          </div>
          <strong>Live filter</strong>
          <p>Narrows the list as you type</p>
        </div>
        <div class="card">
          <div class="host">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="" />
            <span>api.github.com</span>
            <span class="count">312</span>
          </div>
          <strong>By domain</strong>
          <p>Open a host, click to copy</p>
        </div>
      </div>
    </div>
  </body>
</html>
